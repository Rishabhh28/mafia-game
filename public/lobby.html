<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby — Mafia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
</head>
<body>
  <div class="vignette"></div>
  <main class="page">
    <div class="brand">
      <h1>The Table</h1>
      <p>Share the code. Wait for the host.</p>
    </div>
    <div class="room-code" id="code-display">——————</div>
    <ul class="player-list" id="player-list"></ul>
    <div class="stack" style="width:min(480px,100%)">
      <button class="btn" id="ready-btn" type="button">Ready</button>
      <button class="btn btn-primary hidden" id="start-btn" type="button" disabled>Start Game</button>
      <button type="button" class="rules-btn rules-btn-header" onclick="openRulesModal()" style="margin-top:0.25rem;">
        <span>📖</span> How to Play & Rules
      </button>
    </div>

    <!-- Town Lobby Discussion Chat -->
    <div class="town-chat" id="town-chat" style="width:min(480px,100%); margin-top:1.5rem;">
      <div class="town-chat-header">
        <h3>💬 Lobby Chat</h3>
        <span class="town-chat-subtitle">Chat with players while waiting</span>
      </div>
      <div class="town-messages" id="town-messages" style="height:160px;"></div>
      <div class="town-input-row">
        <input id="town-input" type="text" maxlength="280" placeholder="Type a message to the lobby..."/>
        <button type="button" id="town-send">Send</button>
      </div>
    </div>

    <p class="error-banner" id="error"></p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/game-state.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/rules.js"></script>
  <script src="/js/town-chat.js"></script>
  <script src="/js/socket-client.js"></script>
  <script>
    loadSession();
    const params = new URLSearchParams(location.search);
    const create = params.get('create') === '1';
    const codeParam = (params.get('code') || '').toUpperCase();
    if (codeParam) GameState.code = codeParam;
    if (!GameState.name) {
      location.href = '/';
    }

    const socket = connectSocket();
    attachCommonErrors(socket);

    function refreshStart() {
      const start = document.getElementById('start-btn');
      const connected = GameState.players.filter((p) => p.connected).length;
      start.disabled = connected < 4;
      start.classList.toggle('hidden', !GameState.isHost);
    }

    socket.on('connect', () => {
      initTownChat(socket);
      if (create && !GameState.code) {
        socket.emit('room:create', { playerName: GameState.name, uuid: GameState.uuid });
      } else {
        joinRoom(socket);
      }
    });

    socket.on('room:created', ({ code, playerId, players }) => {
      GameState.code = code;
      GameState.playerId = playerId;
      GameState.isHost = true;
      applyPlayers(players);
      saveSession();
      history.replaceState({}, '', '/lobby.html?code=' + encodeURIComponent(code));
      document.getElementById('code-display').textContent = code;
      renderLobbyPlayers(document.getElementById('player-list'));
      refreshStart();
    });

    socket.on('room:joined', (payload) => {
      GameState.code = payload.code;
      GameState.playerId = payload.playerId;
      GameState.role = payload.role || null;
      GameState.factionMembers = payload.factionMembers || [];
      GameState.isAlive = payload.isAlive !== false;
      applyPlayers(payload.players);
      saveSession();
      document.getElementById('code-display').textContent = payload.code;
      renderLobbyPlayers(document.getElementById('player-list'));
      refreshStart();
      if (payload.phase && payload.phase !== 'lobby') {
        location.href = '/game.html';
      }
    });

    socket.on('player:joined', ({ players }) => {
      applyPlayers(players);
      renderLobbyPlayers(document.getElementById('player-list'));
      refreshStart();
    });

    socket.on('player:left', ({ players }) => {
      applyPlayers(players);
      renderLobbyPlayers(document.getElementById('player-list'));
      refreshStart();
    });

    socket.on('host:changed', ({ hostId }) => {
      GameState.isHost = hostId === GameState.playerId;
      refreshStart();
    });

    socket.on('role:assigned', ({ role, factionMembers }) => {
      GameState.role = role;
      GameState.factionMembers = factionMembers || [];
      saveSession();
      location.href = '/game.html';
    });

    socket.on('room:reset', ({ players, code }) => {
      applyPlayers(players);
      GameState.code = code;
      GameState.role = null;
      renderLobbyPlayers(document.getElementById('player-list'));
      refreshStart();
    });

    document.getElementById('ready-btn').addEventListener('click', () => {
      socket.emit('player:ready');
    });
    document.getElementById('start-btn').addEventListener('click', () => {
      socket.emit('game:start');
    });
  </script>
</body>
</html>
